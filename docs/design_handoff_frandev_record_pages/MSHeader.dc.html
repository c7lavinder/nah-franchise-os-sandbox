<x-dc>
<helmet>

      <svg viewBox="0 0 24 24" fill="none" stroke="#b4b4b4" stroke-width="2.2" stroke-linecap="round" style="position:absolute;left:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:20px;font-size:12.5px;color:#646464;white-space:nowrap;">
    <span style="cursor:pointer" style-hover="color:#00A1E1">Gunner <span style="color:#b4b4b4">▾</span></span>
    <span style="cursor:pointer" style-hover="color:#00A1E1">Reports <span style="color:#b4b4b4">▾</span></span>
    <span style="cursor:pointer" style-hover="color:#00A1E1">Corey Wilson <span style="color:#b4b4b4">▾</span></span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:52}}"></script>
