name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Type check
        run: npm run type-check
      - name: Cleanup-critical tests
        run: npm run test:cleanup
      - name: Lint
        run: npm run lint
      - name: Test suite
        run: npm test
